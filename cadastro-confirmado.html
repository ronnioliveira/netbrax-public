<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro confirmado — SoloStep</title>
<style>
  :root {
    --primary: #1A5C3E;
    --background: #F5F2EC;
    --surface: #FFFFFF;
    --text: #1A1917;
    --text-secondary: #5C5852;
    --border: #E5E0D8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--background);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .check {
    width: 64px;
    height: 64px;
    border-radius: 999px;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 24px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 12px;
  }
  p {
    color: var(--text-secondary);
    font-size: 15px;
    line-height: 1.6;
    margin: 0 0 8px;
  }
  .brand {
    margin-top: 32px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .brand b { color: var(--primary); }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Cadastro confirmado!</h1>
    <p>Seu e-mail foi verificado com sucesso.</p>
    <p>Pode fechar esta página e voltar para o app SoloStep para fazer login.</p>
    <div class="brand"><b>soloStep</b> · Conectando passo a passo</div>
  </div>
</body>
</html>
